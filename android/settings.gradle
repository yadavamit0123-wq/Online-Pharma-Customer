pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id "com.android.application" version "8.7.3" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
