name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
      - "public/manifest.json"
      - "public/logo-*.png"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode and convert release keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing or empty."
            echo "Run: ./scripts/encode-keystore.sh \"/path/to/prt (2).jks\""
            exit 1
          fi

          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > app/release-input.keystore || {
            echo "::error::Base64 decode failed. Re-create ANDROID_KEYSTORE_BASE64 (single line, no quotes)."
            exit 1
          }

          SIZE=$(wc -c < app/release-input.keystore | tr -d ' ')
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::Decoded keystore too small (${SIZE} bytes). Expected ~2709 bytes."
            echo "Secret may be truncated or wrong. Run scripts/encode-keystore.sh locally."
            exit 1
          fi
          echo "Decoded keystore: ${SIZE} bytes"

          # PKCS12 keystores (often saved as .jks) cause "Tag number over 30 is not supported"
          # in Android Gradle signing — convert to legacy JKS format.
          keytool -importkeystore -noprompt \
            -srckeystore app/release-input.keystore \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -destkeystore app/release.keystore \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS"
          rm -f app/release-input.keystore

      - name: Create keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Print signing fingerprints (for assetlinks.json + Firebase)
        working-directory: android
        run: |
          echo "## Signing fingerprints" >> $GITHUB_STEP_SUMMARY
          keytool -list -v \
            -keystore app/release.keystore \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            | grep -E "SHA1|SHA256" | tee -a $GITHUB_STEP_SUMMARY

      - name: Verify keystore exists
        working-directory: android
        run: |
          test -f app/release.keystore || (echo "Keystore missing — check ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -f keystore.properties || (echo "keystore.properties missing" && exit 1)

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pharma-customer-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pharma-customer-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/app/build/outputs/
          if-no-files-found: ignore
