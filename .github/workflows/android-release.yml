name: Build Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-release.yml"
      - "public/manifest.json"
      - "public/logo-*.png"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode release keystore
        working-directory: android
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Create keystore.properties
        working-directory: android
        run: |
          cat > keystore.properties <<EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Print signing fingerprints (for assetlinks.json + Firebase)
        working-directory: android
        run: |
          echo "## Signing fingerprints" >> $GITHUB_STEP_SUMMARY
          keytool -list -v \
            -keystore app/release.keystore \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            | grep -E "SHA1|SHA256" | tee -a $GITHUB_STEP_SUMMARY

      - name: Verify keystore exists
        working-directory: android
        run: |
          test -f app/release.keystore || (echo "Keystore missing — check KEYSTORE_BASE64 secret" && exit 1)
          test -f keystore.properties || (echo "keystore.properties missing" && exit 1)

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pharma-customer-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: online-pharma-customer-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload mapping (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/app/build/outputs/
          if-no-files-found: ignore
